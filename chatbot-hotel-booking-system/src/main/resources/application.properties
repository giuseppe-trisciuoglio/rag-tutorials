### LangChain4J Configuration for OpenRouter (OpenAI-compatible API)
langchain4j.open-ai.chat-model.api-key=${OPENROUTER_API_KEY}
langchain4j.open-ai.chat-model.base-url=https://openrouter.ai/api/v1
langchain4j.open-ai.chat-model.model-name=openai/gpt-4o
langchain4j.open-ai.chat-model.strict-tools=true
langchain4j.open-ai.chat-model.temperature=0.0
langchain4j.open-ai.chat-model.timeout=PT60S
langchain4j.open-ai.chat-model.log-requests=false
langchain4j.open-ai.chat-model.log-responses=true

logging.level.org.springframework=ERROR
logging.level.dev.langchain4j=DEBUG
logging.level.ai.djl=DEBUG
logging.level.com.github.rag.tutorials.chatbot=DEBUG

spring.datasource.driverClassName=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:hotel_booking;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
